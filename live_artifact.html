<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Paper Radar — Live</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --bg-card: #181b21; --bg-card-hover: #1f232b;
    --fg: #e6e8ea; --fg-muted: #8b8f97; --fg-accent: #6ab7ff;
    --border: #2a2f38; --tagline: #b8bcc4;
    --score-bg: #2563eb; --score-fg: #fff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa; --bg-card: #fff; --bg-card-hover: #f5f5f5;
      --fg: #111; --fg-muted: #555; --fg-accent: #1d4ed8;
      --border: #e5e5e5; --tagline: #444;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
         background: var(--bg); color: var(--fg); margin: 0; line-height: 1.55; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border);
           padding: 14px 20px; z-index: 10; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .meta { color: var(--fg-muted); font-size: 13px; }
  select, input, button {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--fg);
    padding: 7px 11px; border-radius: 6px; font-size: 13.5px; font-family: inherit;
  }
  button { cursor: pointer; }
  button:hover { background: var(--bg-card-hover); border-color: var(--fg-accent); }
  #search { flex: 1; min-width: 200px; max-width: 380px; margin-left: auto; }
  main { max-width: 920px; margin: 0 auto; padding: 20px; }
  #status { padding: 24px; text-align: center; color: var(--fg-muted); }
  #status.error { color: #ef4444; }
  .paper { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
           margin-bottom: 12px; overflow: hidden; }
  .paper:hover { background: var(--bg-card-hover); }
  .paper-head { padding: 14px 18px; cursor: pointer;
                display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .rank { font-size: 12.5px; font-weight: 600; color: var(--score-fg); background: var(--score-bg);
          padding: 2px 7px; border-radius: 4px; min-width: 28px; text-align: center; }
  .paper-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .paper-tagline { color: var(--tagline); font-size: 13.5px; margin: 0 0 6px; }
  .paper-meta { font-size: 12px; color: var(--fg-muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .paper-meta a { color: var(--fg-accent); text-decoration: none; }
  .paper-body { display: none; padding: 4px 22px 22px 50px;
                border-top: 1px solid var(--border); background: var(--bg); }
  .paper.open .paper-body { display: block; }
  .paper.open .paper-head { background: var(--bg-card-hover); }
  .paper-body h1 { font-size: 16px; }
  .paper-body h2 { font-size: 14.5px; color: var(--fg-accent); margin-top: 18px; }
  .paper-body p { margin: 8px 0; font-size: 14px; }
  .paper-body code { background: var(--bg-card); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
  .paper-body pre { background: var(--bg-card); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; }
  .paper-body table { border-collapse: collapse; margin: 12px 0; font-size: 13px; }
  .paper-body th, .paper-body td { border: 1px solid var(--border); padding: 6px 10px; }
  .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { padding: 6px 11px; font-size: 12.5px; text-decoration: none; }
  .hidden { display: none !important; }
  .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--fg-muted);
             border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { padding: 32px; text-align: center; color: var(--fg-muted); }
  .fallback { padding: 16px 20px; background: #fbbf2422; border: 1px solid #fbbf24; border-radius: 8px;
              margin: 16px 20px; font-size: 13.5px; }
</style>
</head>
<body>

<div id="fallback" class="fallback hidden">
  ⚠️ <strong>非 Claude Desktop 环境</strong> — 这个页面需要 Claude Desktop 的 Live Artifact 沙盒来调用 paper-radar MCP。<br>
  在浏览器里直接打开它没法拉数据。请改用 <code>digests/&lt;date&gt;/viewer.html</code>（静态版）。
</div>

<header>
  <h1>📚 Paper Radar</h1>
  <span class="meta" id="datemeta">加载中…</span>
  <select id="dateselect" class="hidden"></select>
  <button id="refresh" class="hidden">🔄 刷新</button>
  <input id="search" type="search" placeholder="搜标题 / 一句话定位…" class="hidden" autocomplete="off">
</header>

<main>
  <div id="status">
    <span class="loading"></span>&nbsp; 正在通过 paper-radar MCP 拉取最新论文…
  </div>
  <div id="papers"></div>
  <div id="empty" class="empty hidden">没有匹配的论文。</div>
</main>

<script>
// ─── State ────────────────────────────────────────────────
const state = {
  dates: [],
  currentDate: null,
  papers: [],
  paperBodies: {},  // arxiv_id → full_md (cached after first fetch)
};

// ─── MCP wrapper (Claude Desktop's window.cowork.callMcpTool) ───
async function callMcp(tool, args = {}) {
  if (!window.cowork?.callMcpTool) {
    throw new Error('cowork.callMcpTool unavailable — not in Claude Desktop?');
  }
  return await window.cowork.callMcpTool({
    server: 'paper-radar',
    tool,
    args,
  });
}

// ─── Init ────────────────────────────────────────────────
async function init() {
  // Detect non-Claude-Desktop environment early
  if (!window.cowork?.callMcpTool) {
    document.getElementById('fallback').classList.remove('hidden');
    document.getElementById('status').classList.add('hidden');
    return;
  }

  try {
    const res = await callMcp('list_dates', { limit: 14 });
    state.dates = res.dates || [];
    state.annual = res.annual_digests || [];

    if (state.dates.length === 0) {
      setStatus('没找到任何 digest', true);
      return;
    }

    // Populate date selector
    const sel = document.getElementById('dateselect');
    sel.innerHTML = '';
    [...state.dates, ...state.annual].forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    });
    sel.classList.remove('hidden');
    sel.value = state.dates[0];
    state.currentDate = state.dates[0];

    document.getElementById('refresh').classList.remove('hidden');
    document.getElementById('search').classList.remove('hidden');

    sel.addEventListener('change', () => {
      state.currentDate = sel.value;
      loadDate(state.currentDate);
    });
    document.getElementById('refresh').addEventListener('click', () => {
      state.paperBodies = {};
      loadDate(state.currentDate);
    });
    document.getElementById('search').addEventListener('input', filterPapers);

    await loadDate(state.currentDate);
  } catch (e) {
    setStatus(`MCP 调用失败: ${e.message}`, true);
  }
}

async function loadDate(date) {
  setStatus('正在拉 ' + date + ' 的论文清单…');
  document.getElementById('papers').innerHTML = '';
  try {
    const res = await callMcp('list_papers', { date });
    state.papers = res.papers || [];
    document.getElementById('datemeta').textContent =
      `${date} · ${state.papers.length} papers`;
    if (state.papers.length === 0) {
      setStatus('这天没有论文', false);
      return;
    }
    setStatus(null);
    renderPapers();
  } catch (e) {
    setStatus(`拉取失败: ${e.message}`, true);
  }
}

function renderPapers() {
  const container = document.getElementById('papers');
  container.innerHTML = '';
  state.papers.forEach((p, i) => {
    const rank = p.rank || (i + 1);
    const aid = p.arxiv_id || '';
    const div = document.createElement('div');
    div.className = 'paper';
    div.dataset.blob = `${p.title} ${p.tagline} ${aid}`.toLowerCase();
    div.innerHTML = `
      <div class="paper-head">
        <span class="rank">#${rank}</span>
        <div>
          <p class="paper-title">${escapeHtml(p.title)}</p>
          ${p.tagline ? `<p class="paper-tagline">${escapeHtml(p.tagline)}</p>` : ''}
          <p class="paper-meta">
            ${aid ? `<a href="${p.arxiv_url || ('https://arxiv.org/abs/' + aid)}" target="_blank">${aid}</a>` : ''}
            <span>· 点击展开 6-section（首次会拉 MCP）</span>
          </p>
        </div>
      </div>
      <div class="paper-body">
        <div class="md-target">
          <span class="loading"></span>&nbsp; 加载中…
        </div>
        <div class="actions">
          ${aid ? `<a href="https://arxiv.org/abs/${aid}" target="_blank">📄 arXiv</a>` : ''}
          <button class="btn-ask" data-aid="${aid}">🤖 复制 Ask Claude prompt</button>
        </div>
      </div>
    `;
    container.appendChild(div);
    // Wire up clicks
    div.querySelector('.paper-head').addEventListener('click', () =>
      togglePaper(div, aid)
    );
    div.querySelector('.btn-ask').addEventListener('click', e => {
      e.stopPropagation();
      copyAskPrompt(e.target, aid);
    });
  });
}

async function togglePaper(card, aid) {
  const wasOpen = card.classList.contains('open');
  card.classList.toggle('open');
  if (wasOpen || !aid) return;

  const target = card.querySelector('.md-target');
  if (state.paperBodies[aid]) {
    target.innerHTML = marked.parse(state.paperBodies[aid]);
    return;
  }

  try {
    const res = await callMcp('get_paper', { arxiv_id: aid });
    if (res.full_md) {
      state.paperBodies[aid] = res.full_md;
      target.innerHTML = marked.parse(res.full_md);
    } else {
      target.innerHTML = `<p style="color:#ef4444">${escapeHtml(res.error || '加载失败')}</p>`;
    }
  } catch (e) {
    target.innerHTML = `<p style="color:#ef4444">MCP 调用失败: ${escapeHtml(e.message)}</p>`;
  }
}

function copyAskPrompt(btn, aid) {
  const prompt = `Use \`paper-radar:get_paper\` MCP tool to load ${aid}, then answer:\n\n[your question here]`;
  navigator.clipboard.writeText(prompt).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制 — 粘到 Claude Desktop 主聊天';
    setTimeout(() => btn.textContent = orig, 2200);
  });
}

function filterPapers() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll('.paper').forEach(card => {
    const hit = !q || (card.dataset.blob || '').includes(q);
    card.classList.toggle('hidden', !hit);
    if (hit) any = true;
  });
  document.getElementById('empty').classList.toggle('hidden', any);
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  if (msg === null) {
    el.classList.add('hidden');
  } else {
    el.classList.remove('hidden');
    el.classList.toggle('error', isError);
    el.textContent = msg;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Boot
init();
</script>
</body>
</html>
