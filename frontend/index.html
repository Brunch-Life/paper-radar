<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Radar">
<title>Paper Radar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <img src="/favicon.svg" class="brand-icon" alt="" width="22" height="22">
    <span class="brand-text">Paper Radar</span>
  </div>
  <div class="topbar-spacer"></div>
  <button id="theme-toggle" title="切换主题" aria-label="切换主题">🌓</button>
</header>

<div id="layout">

  <!-- ========== LEFT SIDEBAR ========== -->
  <aside id="sidebar">

    <!-- Top: collapsed action buttons -->
    <div class="sidebar-actions">
      <button id="btn-search" title="搜索 (/)" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button id="btn-refresh" title="刷新数据" aria-label="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button id="btn-top" title="回到最新" aria-label="回到最新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
    </div>

    <!-- Search input (toggled by btn-search, also focused with /) -->
    <div class="sidebar-search hidden" id="sidebar-search">
      <input id="search" type="search" placeholder="搜全部 digest…" autocomplete="off">
    </div>

    <!-- Bottom: expanded date list -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- populated by JS:
        <div class="nav-group">
          <div class="nav-group-title">DAILY</div>
          <a class="nav-item active" href="#day-2026-05-08">2026-05-08</a>
          ...
        </div>
      -->
    </nav>
  </aside>

  <!-- ========== RIGHT MAIN ========== -->
  <main id="main">
    <div id="status-bar"></div>

    <!-- Search-result mode -->
    <section id="search-results" class="hidden">
      <h2 class="day-header search-header">
        <span>搜索结果</span>
        <span class="day-count" id="search-count"></span>
        <button class="day-action" id="search-clear">× 清除</button>
      </h2>
      <div id="search-grid" class="cards-grid"></div>
    </section>

    <!-- Day-block stream (each day has its own section) -->
    <div id="day-stream"></div>

    <div id="empty" class="empty hidden">
      <p>没有匹配的论文。</p>
    </div>
  </main>
</div>

<!-- Detail modal -->
<dialog id="detail">
  <div class="detail-head">
    <h2 id="detail-title"></h2>
    <button id="detail-close" aria-label="关闭">×</button>
  </div>
  <div id="detail-body" class="markdown"></div>
  <div class="detail-actions">
    <a id="detail-arxiv" target="_blank" rel="noopener">📄 arXiv</a>
    <button id="detail-ask">🤖 复制 Ask Claude prompt</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
