<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="论文雷达">
<meta name="theme-color" content="#faf9f6">
<title>论文雷达 · Paper Radar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<!-- apply stored theme before first paint (no flash); storage may be blocked -->
<script>try{if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark');document.querySelector('meta[name=theme-color]').content='#14120e'}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- async font load: fonts.googleapis.com unreachable must NOT block first paint
     (media=print loads without render-blocking; onload flips it live) -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css?v=10">
<!-- defer: don't block first paint; app.js boots without waiting for these -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

<!-- toasts -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="page">

  <!-- masthead top strip: freshness chip + night-mode toggle -->
  <div class="mast-top">
    <button id="btn-refresh" class="fresh" type="button"
            title="数据每天 JST 16:07 自动更新 · 点击手动重新拉取">
      <span class="fresh-dot" aria-hidden="true"></span>
      <span class="fresh-text">数据截至 <b id="fresh-date">—</b></span>
      <span class="fresh-ic" aria-hidden="true">↻</span>
    </button>
    <button id="theme-toggle" class="mast-btn" type="button" aria-label="切换夜读模式">☽ 夜读</button>
  </div>

  <!-- masthead -->
  <header class="masthead">
    <h1 class="brand">论文雷达<span class="dot">.</span><span class="brand-en">Paper Radar — Editorial</span></h1>
    <p class="mast-sub">
      <span>机器人 · 强化学习 · VLA 每日精读</span>
      <span class="sep" aria-hidden="true">|</span>
      <span class="mast-date" id="mast-date">——</span>
    </p>
  </header>
  <div class="double-rule" role="presentation"></div>

  <!-- 栏目 (result views) -->
  <nav class="views" aria-label="栏目">
    <button id="btn-recommend" class="view-btn" type="button" title="为你推荐 · 按你的 👍👎 / 收藏 / 点击 重排">为你推荐</button>
    <span class="views-sep" aria-hidden="true">✦</span>
    <button id="btn-ondemand" class="view-btn" type="button" title="即时精读 · 贴过链接的历史">即时精读历史</button>
    <span class="views-sep" aria-hidden="true">✦</span>
    <button id="btn-weekly" class="view-btn" type="button" title="周报 · 本周综述">本周综述</button>
  </nav>

  <!-- toolbar: dates + search -->
  <nav class="toolbar">
    <div class="dates" id="dates" aria-label="日期导航"></div>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="检索标题 / 摘要 / tag:xxx…"
             autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="搜索全部 digest">
      <kbd class="search-kbd" id="search-kbd" aria-hidden="true">/</kbd>
      <button type="button" class="search-clear" id="search-clear" hidden
              title="清除搜索" aria-label="清除搜索">×</button>
    </div>
  </nav>

  <div id="status-bar" role="status"></div>

  <!-- instant deep-read -->
  <div class="instant">
    <label class="instant-label" for="ondemand-url">即时精读</label>
    <input id="ondemand-url" type="text"
           placeholder="粘贴 arXiv 链接或 id（如 2606.12345），回车提交"
           autocomplete="off" spellcheck="false" aria-label="即时精读链接">
    <button type="button" id="ondemand-go">提交精读</button>
    <span class="instant-note">约 2 分钟生成六节精读 · 结果自动进入「即时精读历史」</span>
  </div>

  <!-- result view (search / recommend / on-demand history / weekly) -->
  <section id="results" class="hidden">
    <div class="kicker">
      <b id="results-title">检索</b>
      <span class="plain" id="results-count"></span>
      <span class="kicker-line" aria-hidden="true"></span>
      <button class="kicker-clear" id="results-clear" type="button">× 返回目录</button>
    </div>
    <div id="results-list"></div>
  </section>

  <!-- daily day-block stream -->
  <section id="stream" aria-label="每日目录"></section>

  <div id="empty" class="empty hidden">
    还没有任何 digest —— 每天 16:07 (JST) 自动生成；也可点顶部「数据截至」重新拉取。
  </div>

  <footer class="colophon">PAPER RADAR · 学术编辑部 · 机器人 × 强化学习 × VLA</footer>
</div>

<!-- back to latest -->
<button id="btn-top" class="fab" type="button" title="回到最新" aria-label="回到最新">↑ 最新</button>

<!-- ═══ READER: article page ═══ -->
<div id="reader" class="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-crumb" tabindex="-1">
  <header class="reader-bar">
    <button class="reader-back" id="reader-back" type="button">← 目录</button>
    <span class="reader-crumb" id="reader-crumb"></span>
    <div class="reader-acts">
      <div class="acts paper-actions" id="reader-actions" data-pid="">
        <button class="act vote-up" data-act="up" type="button" aria-pressed="false" title="赞 / 多推这类" aria-label="赞，多推这类">👍</button>
        <button class="act vote-down" data-act="down" type="button" aria-pressed="false" title="踩 / 少推这类" aria-label="踩，少推这类">👎</button>
        <button class="act save-btn" data-act="save" type="button" aria-pressed="false" title="收藏" aria-label="收藏">🔖</button>
        <button class="act del-btn" data-act="del" type="button" title="删除（删掉精读文件和数据，重新生成即可）" aria-label="删除">🗑</button>
      </div>
      <a class="arxiv-link" id="reader-arxiv" target="_blank" rel="noopener" hidden>arXiv ↗</a>
      <button class="ask-btn" id="btn-ask" type="button">💬 问这篇论文</button>
    </div>
  </header>
  <div class="article-wrap">
    <div class="reader-tags" id="reader-tags"></div>
    <article class="article-body" id="article"></article>
  </div>
</div>

<!-- floating actions shown when text is selected in the article -->
<div id="sel-pop" class="sel-pop" hidden>
  <button class="sp-btn" data-sp="hl" type="button" title="高亮">🖍 高亮</button>
  <button class="sp-btn" data-sp="note" type="button" title="高亮并加备注">✎ 备注</button>
  <button class="sp-btn" data-sp="ask" type="button" title="就选中内容提问">💬 问选中</button>
</div>

<!-- ═══ CHAT drawer ═══ -->
<div id="chat-backdrop" hidden></div>
<aside id="chat" class="chat" aria-label="问这篇论文">
  <header class="chat-head">
    <h3><b>问</b>这篇论文</h3>
    <div class="chat-head-acts">
      <button id="chat-copy" class="chat-mini" type="button" title="复制可粘到 Claude Code 主对话的 MCP prompt">复制 MCP prompt</button>
      <button id="chat-clear" class="chat-mini" type="button" title="清空这篇论文的对话">清空</button>
      <button id="chat-close" class="chat-close" type="button" title="收起" aria-label="收起对话">×</button>
    </div>
  </header>
  <div class="chat-msgs" id="chat-msgs"></div>
  <footer class="chat-foot">
    <div id="chat-quote" class="chat-quote" hidden>
      <span class="cq-mark" aria-hidden="true">❝</span>
      <span class="cq-text" id="cq-text"></span>
      <button id="cq-x" class="cq-x" type="button" title="取消引用" aria-label="取消引用">×</button>
    </div>
    <div class="chat-input-row">
      <textarea id="chat-q" rows="2" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）" disabled></textarea>
      <button id="chat-send" class="chat-send" type="button" disabled>发送</button>
    </div>
  </footer>
</aside>

<script src="app.js?v=10"></script>
</body>
</html>
